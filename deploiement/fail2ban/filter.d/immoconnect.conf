# fail2ban — filtre ImmoConnect (détection d'intrusion au niveau du serveur, chapitre 9.6 du rapport).
# Le backend écrit une ligne par alerte dans son journal, que Docker enregistre au format JSON :
#   ... ALERTE_SECURITE type=enumeration ip=203.0.113.9 detail=\"7 comptes différents essayés en 10 min\" ...
# L'adresse qui suit « ip= » est celle du visiteur, transmise par le proxy.
[Definition]
failregex = ALERTE_SECURITE type=(?:rafale_echecs|enumeration) ip=<HOST>\s
ignoreregex =
