# fail2ban — prison ImmoConnect : une adresse signalée par l'application est bannie du serveur entier.
# L'application bannit déjà l'adresse de la connexion pendant 15 minutes ; ici, le pare-feu lui ferme
# les ports web pendant une heure, et une journée en cas de récidive.
[immoconnect]
enabled = true
filter = immoconnect
# Journaux des conteneurs Docker (le backend y écrit ses alertes)
logpath = /var/lib/docker/containers/*/*-json.log
backend = polling
maxretry = 1
findtime = 3600
bantime = 3600
bantime.increment = true
bantime.maxtime = 86400
# Les conteneurs sont joints à travers Docker : la règle va dans la chaîne DOCKER-USER
chain = DOCKER-USER
banaction = iptables-multiport
port = http,https
