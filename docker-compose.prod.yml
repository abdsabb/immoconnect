# ImmoConnect — production (VPS)
# Démarrage : docker compose -f docker-compose.prod.yml up -d --build
# Les secrets viennent du fichier .env placé à côté (modèle : .env.example), jamais versionné.
# Seul Caddy est exposé à Internet (ports 80 et 443) ; la base et le backend restent sur le réseau Docker.
# Trois conteneurs portent l'application (frontend, backend, db) ; les autres sont des services d'exploitation :
# caddy (HTTPS), mailpit (boîte de démonstration), sauvegarde, matomo et sa base (mesure d'audience).
name: immoconnect-prod

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD manque dans .env}
      MYSQL_DATABASE: immoconnect
      MYSQL_USER: immo
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manque dans .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://db:3306/immoconnect?serverTimezone=Europe/Brussels&characterEncoding=UTF-8
      DB_USER: immo
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manque dans .env}
      SITE_URL: https://${DOMAINE}
      # Rendu côté serveur des pages publiques : le backend lit l'index.html construit auprès du frontend
      RENDU_COQUILLE: http://frontend/index.html
      STORAGE_DIR: /app/stockage
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY manque dans .env}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:?STRIPE_PUBLISHABLE_KEY manque dans .env}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_MOYENS: ${STRIPE_MOYENS:-card,bancontact}
      MAIL_FROM: ${MAIL_FROM:-no-reply@immoconnect.be}
      # Les e-mails arrivent dans Mailpit : le site le dit aux personnes qui s'inscrivent. Avec un autre serveur
      # SMTP, mettre DEMO_BOITE_COURRIELS= (vide) dans .env : le lien vers la boîte de démonstration disparaît.
      DEMO_BOITE_COURRIELS: ${DEMO_BOITE_COURRIELS-/courriels/}
      # Mesure d'audience Matomo : vide tant que le site n'est pas déclaré dans Matomo (voir le README)
      MATOMO_SITE_ID: ${MATOMO_SITE_ID:-}
      COOKIE_SECURE: "true"
      # Site de démonstration : pas de lien d'activation à l'inscription (mettre true dans .env pour l'exiger).
      # La connexion en deux étapes est proposée à tous et imposée à personne : chacun l'active dans son profil.
      ACTIVATION_PAR_COURRIEL: ${ACTIVATION_PAR_COURRIEL:-false}
      DOUBLE_FACTEUR: ${DOUBLE_FACTEUR:-true}
      # Par défaut, les e-mails sont remis à Mailpit : voir le service ci-dessous
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-immoconnect}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-immoconnect}
    volumes:
      - photos:/app/stockage
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/index.html || exit 1"]
      interval: 30s
      retries: 3

  # Sauvegardes : base chaque nuit, photos chaque dimanche, chiffrées si SAUVEGARDE_PASSPHRASE est fournie.
  # Procédure de restauration et de test : deploiement/sauvegarde/restaurer.sh et README.
  sauvegarde:
    image: mysql:8.4
    restart: unless-stopped
    entrypoint: ["bash", "/sauvegarder.sh"]
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      SAUVEGARDE_PASSPHRASE: ${SAUVEGARDE_PASSPHRASE:-}
      SAUVEGARDE_HEURE: ${SAUVEGARDE_HEURE:-03:15}
      TZ: Europe/Brussels
    volumes:
      - ./deploiement/sauvegarde/sauvegarder.sh:/sauvegarder.sh:ro
      - ./deploiement/sauvegarde/restaurer.sh:/restaurer.sh:ro
      - sauvegardes:/sauvegardes
      - photos:/photos:ro
    depends_on:
      db:
        condition: service_healthy

  # Mesure d'audience auto-hébergée, sans cookie (chapitre 10) : aucune donnée ne quitte le serveur.
  # Interface sur https://<domaine>/matomo/ ; première installation décrite dans le README.
  matomo:
    image: matomo:5-apache
    restart: unless-stopped
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_USERNAME: matomo
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DB_PASSWORD:-${DB_PASSWORD}}
      MATOMO_DATABASE_DBNAME: matomo
    volumes:
      - matomo-data:/var/www/html
    depends_on:
      matomo-db:
        condition: service_healthy

  matomo-db:
    image: mariadb:11.4
    restart: unless-stopped
    command: --max-allowed-packet=64MB
    environment:
      MARIADB_DATABASE: matomo
      MARIADB_USER: matomo
      MARIADB_PASSWORD: ${MATOMO_DB_PASSWORD:-${DB_PASSWORD}}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - matomo-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 12

  # Boîte de réception de démonstration : capture les e-mails de l'application, n'en envoie aucun.
  # Les comptes de test portent des adresses fictives ; un vrai serveur SMTP écrirait à des inconnus.
  # Lecture des messages sur https://<domaine>/courriels/, protégée par mot de passe.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_WEBROOT: courriels
      MP_UI_AUTH: ${COURRIELS_UTILISATEUR:-jury}:${COURRIELS_MOT_DE_PASSE:?COURRIELS_MOT_DE_PASSE manque dans .env}
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "500"
    volumes:
      - mailpit-data:/data

  # Point d'entrée unique : certificat HTTPS obtenu et renouvelé automatiquement (Let's Encrypt)
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAINE: ${DOMAINE:?DOMAINE manque dans .env}
    volumes:
      - ./deploiement/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [frontend, backend, mailpit, matomo]

volumes:
  mysql-data:
  photos:
  mailpit-data:
  caddy-data:
  caddy-config:
  sauvegardes:
  matomo-data:
  matomo-db-data:
