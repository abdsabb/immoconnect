# Nginx — sert la SPA React et relaie /api vers le backend (réseau Docker interne)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de sécurité (livrable 16, §4.2)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API REST et documentation Swagger → conteneur backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /swagger-ui/ { proxy_pass http://backend:8080/swagger-ui/; }
    location /swagger-ui.html { proxy_pass http://backend:8080/swagger-ui.html; }
    location /v3/api-docs { proxy_pass http://backend:8080/v3/api-docs; }

    # Ressources statiques avec empreinte : cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Routage côté client de la SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
