# Nginx — sert la SPA React et relaie /api vers le backend (réseau Docker interne)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de sécurité (livrable 16, §4.2)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API REST et documentation Swagger → conteneur backend
    location /api/ {
        # Une photo de bien pèse 5 Mo au plus (limite appliquée par le backend)
        client_max_body_size 6m;
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Photos des biens, servies par le backend depuis son volume de stockage
    location /storage/ {
        proxy_pass http://backend:8080/storage/;
        client_max_body_size 1k;
    }
    location /swagger-ui/ { proxy_pass http://backend:8080/swagger-ui/; }
    location /swagger-ui.html { proxy_pass http://backend:8080/swagger-ui.html; }
    location /v3/api-docs { proxy_pass http://backend:8080/v3/api-docs; }

    # Pages publiques rendues côté serveur (chapitre 10 du rapport) : le backend complète index.html du
    # titre, de la description, des balises hreflang, des données Schema.org et du contenu visible.
    # S'il ne répond pas, l'application seule est servie : le site reste utilisable.
    location = / {
        proxy_pass http://backend:8080/rendu/;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 502 503 504 = /index.html;
    }
    location ~ ^/(a-vendre|a-louer|biens|blog|contact|biens/[0-9]+|blog/[0-9]+)/?$ {
        rewrite ^/(.*?)/?$ /rendu/$1 break;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 502 503 504 = /index.html;
    }
    # Plan du site et consignes aux robots, générés depuis les données
    location = /sitemap.xml { proxy_pass http://backend:8080/sitemap.xml; }
    location = /robots.txt { proxy_pass http://backend:8080/robots.txt; }

    # Ressources statiques avec empreinte : cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # La page d'entrée désigne les fichiers de la version en cours : le navigateur doit la revérifier
    # à chaque visite, sinon il continue d'afficher l'ancienne version après une mise à jour.
    # Un bloc qui pose un en-tête n'hérite plus de ceux du serveur : ils sont répétés ici.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Routage côté client de la SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
