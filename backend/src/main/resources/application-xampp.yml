# Profil XAMPP (dépannage) — base locale de XAMPP (root sans mot de passe, port 3306).
# Créer d'abord la base « immoconnect » (utf8mb4_unicode_ci) dans phpMyAdmin.
# Lancement : -Dspring.profiles.active=xampp   (NetBeans : Run > VM Options)
# Attention : XAMPP fournit MariaDB, pas MySQL 8.4 — l'environnement de référence reste Docker.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/immoconnect?serverTimezone=Europe/Brussels&characterEncoding=UTF-8
    username: root
    password:
  jpa:
    show-sql: true
  mail:
    host: localhost
    port: 1025

logging:
  level:
    be.immoconnect: DEBUG
