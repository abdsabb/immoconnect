# ImmoConnect — configuration commune (profil actif par défaut : dev)
spring:
  application:
    name: immoconnect-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # le schéma est géré par Flyway, jamais par Hibernate
    properties:
      hibernate.jdbc.time_zone: Europe/Brussels
      hibernate.default_batch_fetch_size: 50   # charge agents/catégories/photos par lots (anti N+1)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  web:
    locale: fr_BE                # messages de validation en français
    locale-resolver: fixed
  jackson:
    time-zone: Europe/Brussels   # Jackson 3 (Spring Boot 4) sérialise déjà les dates en ISO-8601
  servlet:
    multipart:
      max-file-size: 5MB         # une photo de bien ; au-delà, réponse 413
      max-request-size: 6MB

server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: never      # jamais de trace technique vers le client, même en dev
    include-exception: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

immoconnect:
  api-version: v1
  api:
    appels-par-minute: 60           # quota de l'API ouverte, par clé (au-delà : 429)
  creneau-premium:
    prix: 15.00
  courriel:
    expediteur: ${MAIL_FROM:no-reply@immoconnect.be}
    url-site: ${SITE_URL:http://localhost:5173}   # base des liens placés dans les e-mails
    delai-entre-tentatives: 2s                    # un envoi échoué est retenté (cas d'erreur E2)
  stockage:
    dossier: ${STORAGE_DIR:./stockage}            # photos des biens ; un volume Docker en production
  demonstration:
    photos: ${DEMO_PHOTOS:true}     # crée au démarrage les photos manquantes des annonces de test
    boite-courriels: ${DEMO_BOITE_COURRIELS:}   # adresse de la boîte où arrivent les e-mails (Mailpit), vide en exploitation réelle
  rendu:
    coquille: ${RENDU_COQUILLE:}    # adresse interne de l'index.html construit (http://frontend/index.html) ; vide : pas de rendu serveur
  stripe:                           # sans clé secrète, les paiements passent en mode simulation (dev et tests)
    cle-secrete: ${STRIPE_SECRET_KEY:}
    cle-publique: ${STRIPE_PUBLISHABLE_KEY:}
    secret-webhook: ${STRIPE_WEBHOOK_SECRET:}
    moyens: ${STRIPE_MOYENS:card,bancontact}   # moyens proposés : carte et Bancontact (repli sur la carte si Stripe refuse)
  jwt:
    secret: ${JWT_SECRET}           # clé HS256 (>= 32 octets) — fournie par l'environnement
    duree-secondes: 900             # jeton d'accès valable 15 min, renouvelé par le cookie de session (livrable 16, §2.1)
  securite:
    cookie-securise: ${COOKIE_SECURE:true}          # le cookie de session ne voyage qu'en HTTPS
    duree-session: 14d                              # durée de vie du jeton de rafraîchissement
    activation-par-courriel: ${ACTIVATION_PAR_COURRIEL:true}
    double-facteur: ${DOUBLE_FACTEUR:true}          # code par e-mail : agents, administrateurs, membres qui l'ont choisi
    echecs-avant-verrouillage: 5                    # puis verrouillage d'une minute, doublé à chaque échec, plafonné à 15 min
    connexions-par-minute: 10                       # par adresse IP
    mots-de-passe-compromis: ${MOTS_DE_PASSE_COMPROMIS:hibp}   # hibp (Have I Been Pwned) ou local
