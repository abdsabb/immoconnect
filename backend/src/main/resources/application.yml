# ImmoConnect — configuration commune (profil actif par défaut : dev)
spring:
  application:
    name: immoconnect-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # le schéma est géré par Flyway, jamais par Hibernate
    properties:
      hibernate.jdbc.time_zone: Europe/Brussels
      hibernate.default_batch_fetch_size: 50   # charge agents/catégories/photos par lots (anti N+1)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  web:
    locale: fr_BE                # messages de validation en français
    locale-resolver: fixed
  jackson:
    time-zone: Europe/Brussels   # Jackson 3 (Spring Boot 4) sérialise déjà les dates en ISO-8601

server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: never      # jamais de trace technique vers le client, même en dev
    include-exception: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

immoconnect:
  api-version: v1
  creneau-premium:
    prix: 15.00
  jwt:
    secret: ${JWT_SECRET}           # clé HS256 (>= 32 octets) — fournie par l'environnement
    duree-secondes: 3600            # jeton d'accès valable 1 h (livrable 16, §2.1)
