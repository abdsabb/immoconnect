# Profil DEV — MySQL 8.4 du docker compose (docker compose up -d db)
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/immoconnect?serverTimezone=Europe/Brussels&characterEncoding=UTF-8
    username: immo
    password: immo
  jpa:
    show-sql: true
  mail:
    host: localhost
    port: 1025                    # Mailpit / MailHog en dev (aucun vrai e-mail envoyé)

logging:
  level:
    be.immoconnect: DEBUG
    org.flywaydb: INFO

management:
  health:
    mail:
      enabled: false     # pas de serveur SMTP en dev : ne pas faire tomber le contrôle de santé

immoconnect:
  jwt:
    secret: dev-immoconnect-secret-jwt-ne-pas-utiliser-en-production-2026   # dev uniquement
