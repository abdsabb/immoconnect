# ImmoConnect e-mails — English. Same arguments as messages_fr.properties.
# Typographic apostrophe (’) only: the straight apostrophe is a special character for MessageFormat.

signature=The ImmoConnect team\nThis e-mail was sent automatically, please do not reply.

demande.agent.sujet=[ImmoConnect] New visit request — {1}
demande.agent.corps=Hello {0},\n\n{7} would like to visit “{1}” on {2} at {3}.\nReason: {8}\n\nConfirm or cancel this request from your schedule:\n{9}

confirme.membre.sujet=[ImmoConnect] Your visit is confirmed — {1}
confirme.membre.corps=Hello {0},\n\nYour visit of “{1}” is confirmed.\n\nDate: {2} at {3}\nAddress: {4}\nYour agent: {5} ({6})\n\nIf you can’t make it, cancel your visit from your account:\n{9}

paye.agent.sujet=[ImmoConnect] Premium visit booked — {1}
paye.agent.corps=Hello {0},\n\n{7} has booked and paid a premium slot to visit “{1}” on {2} at {3}.\nReason: {8}\n\nThe visit is confirmed and appears in your schedule:\n{9}

annule.agent.sujet=[ImmoConnect] Visit cancelled — {1}
annule.agent.corps=Hello {0},\n\n{7} has cancelled the visit of “{1}” planned on {2} at {3}.\nThe slot is free again in your schedule:\n{9}

annule.membre.sujet=[ImmoConnect] Your visit is cancelled — {1}
annule.membre.corps=Hello {0},\n\n{5} had to cancel your visit of “{1}” planned on {2} at {3}.\nYou can choose another slot on the property page, or reach your agent on {6}.

annule.membre.rembourse.sujet=[ImmoConnect] Your visit is cancelled — {1}
annule.membre.rembourse.corps=Hello {0},\n\n{5} had to cancel your visit of “{1}” planned on {2} at {3}.\nThe payment of your premium slot is refunded; it will appear on your account within a few days.\n\nYou can choose another slot on the property page, or reach your agent on {6}.

# Accounts — {0} first name, {1} link or code, {2} validity
compte.activation.sujet=[ImmoConnect] Confirm your e-mail address
compte.activation.corps=Hello {0},\n\nWelcome to ImmoConnect. To activate your account, confirm your e-mail address by opening this link:\n{1}\n\nThis link is valid for {2} hours. If you did not sign up, ignore this e-mail: no account will be activated.

compte.reinitialisation.sujet=[ImmoConnect] Reset your password
compte.reinitialisation.corps=Hello {0},\n\nYou asked for a new password. Choose it by opening this link:\n{1}\n\nThis link is valid for {2} minutes and works only once. If you did not ask for anything, ignore this e-mail: your password stays unchanged.

compte.mot_de_passe_modifie.sujet=[ImmoConnect] Your password has been changed
compte.mot_de_passe_modifie.corps=Hello {0},\n\nThe password of your account has just been changed and all your sessions have been closed.\n\nIf you did not make this change, take back control of your account right away:\n{1}

compte.code_connexion.sujet=[ImmoConnect] Your login code: {1}
compte.code_connexion.corps=Hello {0},\n\nYour login code is: {1}\n\nIt is valid for {2} minutes. If you are not trying to log in, someone knows your password: change it as soon as possible.

# Intrusion detection alert, sent to super-administrators
securite.alerte.sujet=[ImmoConnect] Security alert: {1}
securite.alerte.corps=Hello {0},\n\nIntrusion detection recorded abnormal activity on {4}.\n\nType: {1}\nIP address: {2}\nDetail: {3}\n\nThe address is banned from logging in for fifteen minutes. Procedure: check the audit log, block the address or revoke the key if the activity is confirmed, assess the impact and record the follow-up. If personal data is involved, the Data Protection Authority must be notified within 72 hours.

# Demande du formulaire de contact, transmise à l'adresse de l'agence
contact.agence.sujet=[ImmoConnect] Contact : {3}
contact.agence.corps=Nouvelle demande reçue par le formulaire de contact.\n\nDe : {0}\nE-mail : {1}\nTéléphone : {2}\nSujet : {3}\n\n{4}\n\nRépondez directement à {1}, puis marquez la demande comme traitée dans le back-office.
