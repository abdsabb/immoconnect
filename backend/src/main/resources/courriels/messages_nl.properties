# Waarschuwing van de inbraakdetectie, verstuurd naar de superbeheerders
securite.alerte.sujet=[ImmoConnect] Beveiligingswaarschuwing: {1}
securite.alerte.corps=Beste {0},\n\nDe inbraakdetectie heeft op {4} abnormale activiteit vastgesteld.\n\nType: {1}\nIP-adres: {2}\nDetail: {3}\n\nHet adres is vijftien minuten uitgesloten van het aanmelden. Procedure: het auditlogboek nakijken, het adres blokkeren of de sleutel intrekken als de activiteit bevestigd wordt, de impact inschatten en het gevolg noteren. Gaat het om persoonsgegevens, dan moet de Gegevensbeschermingsautoriteit binnen 72 uur verwittigd worden.
