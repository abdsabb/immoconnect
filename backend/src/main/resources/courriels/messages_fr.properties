# E-mails ImmoConnect — français. Arguments : {0} prénom du destinataire, {1} bien, {2} date, {3} heure,
# {4} adresse, {5} agent, {6} téléphone de l’agent, {7} membre, {8} motif, {9} lien vers les rendez-vous.
# Apostrophe typographique (’) uniquement : l’apostrophe droite est un caractère spécial de MessageFormat.

signature=L’équipe ImmoConnect\nCet e-mail est envoyé automatiquement, merci de ne pas y répondre.

demande.agent.sujet=[ImmoConnect] Nouvelle demande de visite — {1}
demande.agent.corps=Bonjour {0},\n\n{7} souhaite visiter « {1} » le {2} à {3}.\nMotif : {8}\n\nConfirmez ou annulez cette demande depuis votre agenda :\n{9}

confirme.membre.sujet=[ImmoConnect] Votre visite est confirmée — {1}
confirme.membre.corps=Bonjour {0},\n\nVotre visite de « {1} » est confirmée.\n\nDate : {2} à {3}\nAdresse : {4}\nVotre agent : {5} ({6})\n\nEn cas d’empêchement, annulez votre visite depuis votre espace :\n{9}

paye.agent.sujet=[ImmoConnect] Visite premium réservée — {1}
paye.agent.corps=Bonjour {0},\n\n{7} a réservé et payé un créneau premium pour visiter « {1} » le {2} à {3}.\nMotif : {8}\n\nLa visite est confirmée et figure dans votre agenda :\n{9}

annule.agent.sujet=[ImmoConnect] Visite annulée — {1}
annule.agent.corps=Bonjour {0},\n\n{7} a annulé sa visite de « {1} » prévue le {2} à {3}.\nLe créneau est de nouveau libre dans votre agenda :\n{9}

annule.membre.sujet=[ImmoConnect] Votre visite est annulée — {1}
annule.membre.corps=Bonjour {0},\n\n{5} a dû annuler votre visite de « {1} » prévue le {2} à {3}.\nVous pouvez choisir un autre créneau sur la fiche du bien, ou joindre votre agent au {6}.

annule.membre.rembourse.sujet=[ImmoConnect] Votre visite est annulée — {1}
annule.membre.rembourse.corps=Bonjour {0},\n\n{5} a dû annuler votre visite de « {1} » prévue le {2} à {3}.\nLe paiement de votre créneau premium vous est remboursé ; il apparaîtra sur votre compte sous quelques jours.\n\nVous pouvez choisir un autre créneau sur la fiche du bien, ou joindre votre agent au {6}.

# Comptes — {0} prénom, {1} lien ou code, {2} durée de validité
compte.activation.sujet=[ImmoConnect] Confirmez votre adresse e-mail
compte.activation.corps=Bonjour {0},\n\nBienvenue sur ImmoConnect. Pour activer votre compte, confirmez votre adresse e-mail en ouvrant ce lien :\n{1}\n\nCe lien est valable {2} heures. Si vous n’êtes pas à l’origine de cette inscription, ignorez cet e-mail : aucun compte ne sera activé.

compte.reinitialisation.sujet=[ImmoConnect] Réinitialisation de votre mot de passe
compte.reinitialisation.corps=Bonjour {0},\n\nVous avez demandé un nouveau mot de passe. Choisissez-le en ouvrant ce lien :\n{1}\n\nCe lien est valable {2} minutes et ne sert qu’une fois. Si vous n’avez rien demandé, ignorez cet e-mail : votre mot de passe reste inchangé.

compte.mot_de_passe_modifie.sujet=[ImmoConnect] Votre mot de passe a été modifié
compte.mot_de_passe_modifie.corps=Bonjour {0},\n\nLe mot de passe de votre compte vient d’être modifié et toutes vos sessions ont été fermées.\n\nSi vous n’êtes pas à l’origine de ce changement, reprenez le contrôle de votre compte sans attendre :\n{1}

compte.code_connexion.sujet=[ImmoConnect] Votre code de connexion : {1}
compte.code_connexion.corps=Bonjour {0},\n\nVotre code de connexion est : {1}\n\nIl est valable {2} minutes. Si vous n’essayez pas de vous connecter, quelqu’un connaît votre mot de passe : changez-le dès que possible.

# Alerte de la détection d’intrusion, envoyée aux super-administrateurs
securite.alerte.sujet=[ImmoConnect] Alerte de sécurité : {1}
securite.alerte.corps=Bonjour {0},\n\nLa détection d’intrusion a relevé une activité anormale le {4}.\n\nType : {1}\nAdresse IP : {2}\nDétail : {3}\n\nL’adresse est bannie de la connexion pendant quinze minutes. Procédure : vérifier le journal d’audit, bloquer l’adresse ou révoquer la clé si l’activité se confirme, évaluer l’impact et consigner la suite donnée. Si des données personnelles sont concernées, l’Autorité de protection des données doit être prévenue sous 72 heures.

# Demande du formulaire de contact, transmise à l'adresse de l'agence
contact.agence.sujet=[ImmoConnect] Contact : {3}
contact.agence.corps=Nouvelle demande reçue par le formulaire de contact.\n\nDe : {0}\nE-mail : {1}\nTéléphone : {2}\nSujet : {3}\n\n{4}\n\nRépondez directement à {1}, puis marquez la demande comme traitée dans le back-office.

# Libellé du bouton qui remplace le lien dans la version HTML
demande.agent.bouton=Ouvrir mon agenda
paye.agent.bouton=Ouvrir mon agenda
annule.agent.bouton=Ouvrir mon agenda
confirme.membre.bouton=Voir mes visites
compte.activation.bouton=Activer mon compte
compte.reinitialisation.bouton=Choisir un nouveau mot de passe
compte.mot_de_passe_modifie.bouton=Sécuriser mon compte
