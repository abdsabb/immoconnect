# Réglages propres aux tests, fusionnés par-dessus la configuration de l'application
immoconnect:
  stockage:
    dossier: target/stockage-tests     # effacé par « mvn clean », jamais versionné
  demonstration:
    photos: false                      # inutile aux tests : 498 fichiers à copier à chaque démarrage
  securite:
    cookie-securise: false             # MockMvc parle en HTTP
    activation-par-courriel: false     # les tests s'inscrivent et se connectent aussitôt ; un test dédié l'active
    double-facteur: false              # idem : un test dédié l'active
    mots-de-passe-compromis: local     # jamais d'appel réseau pendant les tests
    connexions-par-minute: 1000        # les tests se connectent des dizaines de fois par minute ; un test dédié abaisse le seuil
    intrusion:
      echecs: 100000                   # les tests échouent exprès à se connecter, tous depuis 127.0.0.1 ; un test dédié abaisse les seuils
      comptes: 100000
