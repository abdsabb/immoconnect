# Intégration continue ImmoConnect — exécutée à CHAQUE push et pull request.
# 1. backend : compilation + tests (JUnit 5 + Testcontainers sur un vrai MySQL 8.4)
# 2. frontend : installation + build de production
# 3. images Docker : construction (sans publication) pour vérifier les Dockerfiles
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend — build et tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tests et packaging
        run: ./mvnw -B --no-transfer-progress verify
      - name: Conserver le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests-backend
          path: backend/target/surefire-reports
          if-no-files-found: ignore

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Images Docker — construction
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Image backend
        run: docker build -t immoconnect-backend:ci ./backend
      - name: Image frontend
        run: docker build -t immoconnect-frontend:ci ./frontend
